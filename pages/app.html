<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#163A5F" />
    <meta name="description" content="Maquette des espaces utilisateurs Ecolia." />
    <title>Espace de travail — Ecolia</title>
    <link rel="icon" href="../assets/logos/ecolia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/site.css" />
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/logout.js"></script>
  </head>
  <body class="workspace-body">
    <a class="skip-link" href="#workspace-main">Aller au contenu</a>
    <div class="workspace" id="workspace">
      <!-- Navigation laterale par role -->
      <aside class="workspace-sidebar" id="workspace-sidebar" aria-label="Navigation de l’espace">
        <a class="workspace-brand" href="../index.html"
          ><img src="../assets/logos/ecolia.svg" alt="Ecolia"
        /></a>
        <p class="workspace-role" data-role-label></p>
        <nav class="workspace-nav" data-workspace-nav></nav>
        <a class="workspace-back" data-dashboard-link href="app.html">← Tableau de bord</a>
        <a class="workspace-back" href="../index.html">← Site public</a>
        <a class="workspace-back" href="login.html" data-logout>Se déconnecter</a>
      </aside>
      <!-- ==========================================
     CONTENU PRINCIPAL DE LA PAGE
========================================== -->
      <main class="workspace-main" id="workspace-main">
        <!-- ==========================================
     BARRE SUPERIEURE DE L ESPACE DE TRAVAIL
========================================== -->
        <header class="workspace-topbar">
          <button
            class="workspace-menu"
            type="button"
            aria-expanded="false"
            aria-controls="workspace-sidebar"
            aria-label="Ouvrir le menu de navigation"
          >
            <span class="workspace-menu-icon" aria-hidden="true"
              ><span></span><span></span><span></span
            ></span>
            <span>Menu</span></button
          ><span class="workspace-context">Maquette d’interface — données non connectées</span
          ><span class="workspace-account">Compte — aperçu</span>
        </header>
        <section class="workspace-content" data-workspace-content aria-live="polite"></section>
        <div class="workspace-toast" role="status" aria-live="polite" hidden></div>
      </main>
    </div>
  </body>
</html>
