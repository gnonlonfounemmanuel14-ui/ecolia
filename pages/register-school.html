<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Créez le compte de votre établissement sur Ecolia." />
    <title>Créer un compte — Ecolia</title>
    <link rel="icon" href="../assets/logos/ecolia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/site.css" />
   <script src="../js/boot-check.js" defer></script>
   <script type="module" src="../js/main.js"></script>
   <script type="module" src="../js/forms-api.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <!-- CONTENU PRINCIPAL DE LA PAGE -->
    <main id="main" class="auth-layout auth-page auth-page--register">
      <section class="auth-main">
        <form
          class="form-card auth-card registration-form"
          data-local-form
          data-auth-form
          data-register-form
          method="post"
          action=""
        >
          <a class="brand auth-brand" href="../index.html"
            ><img src="../assets/logos/ecolia.svg" alt="Ecolia"
          /></a>
          <h1>Créer un compte</h1>
          <p class="form-intro">
            Créez le compte de votre établissement avec votre compte Google ou votre adresse e-mail.
          </p>
          <div class="provider-actions" aria-label="Autres méthodes d’inscription">
            <button class="btn secondary provider-button" type="button" data-provider="google">
              <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"
                />
                <path
                  fill="#34A853"
                  d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"
                />
                <path
                  fill="#FBBC05"
                  d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"
                />
                <path
                  fill="#EA4335"
                  d="M24 12c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"
                />
              </svg>
              Continuer avec Google
            </button>
          </div>
          <p class="auth-message" role="status" aria-live="polite" data-auth-message hidden></p>
          <div class="auth-divider"><span>ou</span></div>
          <div class="field">
            <label for="email">Adresse e-mail *</label>
            <div class="icon-input">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 5h18v14H3zM3 6l9 7 9-7" /></svg
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="Adresse e-mail"
                required
              />
            </div>
          </div>
          <div class="registration-passwords">
            <div class="field">
              <label for="password">Mot de passe *</label>
              <div class="password-wrap icon-input">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="10" width="16" height="11" rx="2" />
                  <path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2" /></svg
                ><input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  placeholder="Créer un mot de passe"
                  required
                  aria-describedby="password-help"
                /><button
                  type="button"
                  data-password-toggle
                  aria-controls="password"
                  aria-pressed="false"
                >
                  Afficher
                </button>
              </div>
              <span class="help" id="password-help">8 caractères minimum.</span>
            </div>
            <div class="field">
              <label for="confirm">Confirmer le mot de passe *</label>
              <div class="password-wrap icon-input">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="10" width="16" height="11" rx="2" />
                  <path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2" /></svg
                ><input
                  id="confirm"
                  name="confirm"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  placeholder="Confirmer le mot de passe"
                  required
                  aria-describedby="confirm-help"
                /><button
                  type="button"
                  data-password-toggle
                  aria-controls="confirm"
                  aria-pressed="false"
                >
                  Afficher
                </button>
              </div>
              <span class="field-error" id="confirm-help" role="alert"></span>
            </div>
          </div>
          <div class="field">
            <label for="school">Nom de l’établissement *</label>
            <input id="school" name="school" autocomplete="organization" required />
          </div>
          <button class="btn green auth-submit" type="submit">Créer mon compte</button>
          <p
            class="auth-message"
            role="status"
            aria-live="polite"
            data-auth-submit-message
            hidden
          ></p>
          <p class="auth-switch">
            Vous avez déjà un compte ? <a href="login.html">Se connecter</a>
          </p>
          <p class="auth-switch"><a href="contact.html">Besoin d’aide ? Contactez-nous</a></p>
        </form>
        <a class="btn secondary small return-home-link" href="../index.html"
          >&larr; Retour &agrave; l&rsquo;accueil</a
        >
      </section>
    </main>
  </body>
</html>
