<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Définir un nouveau mot de passe Ecolia." />
    <title>Nouveau mot de passe — Ecolia</title>
    <link rel="icon" href="../assets/logos/ecolia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/site.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/auth-reset.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>

    <!-- ==========================================
         CONTENU PRINCIPAL DE LA PAGE
    ========================================== -->
    <main id="main" class="auth-layout auth-page">
      <section class="auth-main">
        <form class="form-card auth-card" data-local-form data-auth-form data-api-form data-reset-confirm>
          <a class="brand auth-brand" href="../index.html"
            ><img src="../assets/logos/ecolia.svg" alt="Ecolia"
          /></a>
          <h1>Définir un nouveau mot de passe</h1>
          <p class="form-intro">Choisissez un mot de passe d’au moins 8 caractères.</p>
          <div class="field">
            <label for="password">Nouveau mot de passe</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              /><button
                type="button"
                data-password-toggle
                aria-controls="password"
                aria-pressed="false"
              >
                Afficher
              </button>
            </div>
          </div>
          <div class="field">
            <label for="confirm">Confirmer le mot de passe</label>
            <div class="password-wrap">
              <input
                id="confirm"
                name="confirm"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              /><button
                type="button"
                data-password-toggle
                aria-controls="confirm"
                aria-pressed="false"
              >
                Afficher
              </button>
            </div>
            <span class="field-error" id="confirm-help" role="alert"></span>
          </div>
          <button class="btn green auth-submit" type="submit">Mettre à jour</button>
          <p
            class="auth-message"
            data-auth-submit-message
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <p class="auth-switch"><a href="login.html">Retour à la connexion</a></p>
          <p class="auth-switch"><a href="contact.html">Besoin d’aide ? Contactez-nous</a></p>
        </form>
        <a class="btn secondary small return-home-link" href="../index.html"
          >← Retour à l’accueil</a
        >
      </section>
    </main>
  </body>
</html>
