<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Demander la réinitialisation de son mot de passe Ecolia." />
    <title>Mot de passe oublié — Ecolia</title>
    <link rel="icon" href="../assets/logos/ecolia-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/site.css" />
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/auth-reset.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>

    <!-- ==========================================
         CONTENU PRINCIPAL DE LA PAGE
    ========================================== -->
    <main id="main" class="auth-layout auth-page">
      <section class="auth-main">
        <form class="form-card auth-card" data-local-form data-auth-form data-api-form data-reset-request>
          <a class="brand auth-brand" href="../index.html"
            ><img src="../assets/logos/ecolia.svg" alt="Ecolia"
          /></a>
          <h1>Mot de passe oublié ?</h1>
          <p class="form-intro">Indiquez l’adresse e-mail associée à votre compte.</p>
          <div class="field">
            <label for="email">Adresse e-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="vous@exemple.com"
            />
          </div>
          <button class="btn green auth-submit" type="submit">Recevoir le lien par e-mail</button>
          <p
            class="auth-message"
            data-auth-submit-message
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <p class="auth-switch"><a href="login.html">Retour à la connexion</a></p>
          <p class="auth-switch"><a href="contact.html">Besoin d’aide ? Contactez-nous</a></p>
        </form>
        <a class="btn secondary small return-home-link" href="../index.html"
          >← Retour à l’accueil</a
        >
      </section>
    </main>
  </body>
</html>
